<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rong Jin</title>
  <meta name="description" content="Rong Jin — Busy engineer.">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1c1c1a;
      --muted: #6b6b66;
      --line: #e4e3dc;
      --accent: #2f5d50;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --text: #ecebe6;
        --muted: #9a9993;
        --line: #2c2c2a;
        --accent: #7fb8a4;
        --card: #1c1c1b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 24px 48px;
      flex: 1;
    }
    .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 8vw, 3.6rem);
      line-height: 1.1;
      margin: 12px 0 16px;
      letter-spacing: -0.01em;
    }
    .bio {
      font-size: 1.15rem;
      color: var(--muted);
    }
    section { margin-top: 72px; }
    h2 {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .project {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .project h3 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .project p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.95rem;
    }
    .arrow { color: var(--accent); font-weight: 400; }
    footer {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hello, I'm</p>
    <h1>Rong Jin</h1>
    <p class="bio">Busy engineer.</p>

    <section>
      <h2>Projects</h2>
      <!-- To make the card clickable, change <div> to <a href="https://your-project-link"> and </div> to </a> -->
      <div class="project">
        <h3>Shorten-URL <span class="arrow">&rarr;</span></h3>
        <p>A URL shortening service.</p>
      </div>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Rong Jin &middot; verysoftengineer.com
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
