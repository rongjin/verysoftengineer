<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten URL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#111318,#eef0f4);--soft:light-dark(#5b6170,#a3a9b6);--line:light-dark(#e3e5ea,#262b35);--panel:light-dark(#f4f5f7,#161a22);--red:#e6261f;--blue:#0a5cff;--amber:#ffb400;--green:#00a05a}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;width:100%}
nav{border-bottom:1px solid var(--line)}
nav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:14px max(5vw,16px)}
.logo{font-weight:800;font-size:18px;text-decoration:none;display:flex;align-items:center;gap:10px;margin-right:auto}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;display:block}
nav ul{display:flex;flex-wrap:wrap;gap:4px 20px;list-style:none;margin:0;padding:0}
nav ul a{text-decoration:none;color:var(--soft);font-weight:500;padding:10px 0;display:inline-block}
nav ul a:hover,nav ul a[aria-current]{color:var(--ink)}
main{flex:1;display:grid;place-items:center;padding:clamp(40px,8vw,96px) max(5vw,16px)}
.card{width:100%;max-width:640px}
h1{font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 12px;font-size:clamp(34px,5vw,52px)}
.lead{color:var(--soft);margin:0 0 28px}
form{display:flex;flex-wrap:wrap;gap:12px}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{flex:1 1 280px;font:500 16px Figtree,sans-serif;min-height:52px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
input:focus{border-color:var(--blue);outline:none}
button{font:600 16px Figtree,sans-serif;min-height:52px;padding:0 28px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button:hover{transform:translateY(-1px)}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.msg{margin-top:16px;min-height:1.5em;color:var(--soft)}
.msg.err{color:var(--red)}
h2{font-weight:800;letter-spacing:-.01em;margin:48px 0 8px;font-size:clamp(24px,3.4vw,32px);padding-top:40px;border-top:1px solid var(--line)}
.msg a{color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.msg .copy{min-height:36px;padding:0 14px;font-size:14px;background:transparent;color:var(--ink);border-width:1.5px;margin-left:6px}
footer{border-top:1px solid var(--line)}
footer .wrap{padding:24px max(5vw,16px);color:var(--soft);font-size:14px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html"><span class="dots"><i style="background:var(--red)"></i><i style="background:var(--amber)"></i><i style="background:var(--green)"></i></span>Rong Jin</a>
  <ul><li><a href="index.html#work">Work</a></li><li><a href="index.html#about">About</a></li><li><a href="index.html#contact">Contact</a></li><li><a href="shorten.html" aria-current="page">Shorten URL</a></li></ul>
</div></nav>

<main><div class="card">
  <h1>Shorten a URL</h1>
  <p class="lead">Paste a long link and get a short one back.</p>
  <form id="form" novalidate>
    <label for="url">Long URL</label>
    <input id="url" name="url" type="url" placeholder="https://example.com/a/very/long/link" autocomplete="off" required>
    <button type="submit">Shorten</button>
  </form>
  <p class="msg" id="msg" aria-live="polite"></p>

  <h2>Retrieve a URL</h2>
  <p class="lead">Paste a short link to see the original long URL.</p>
  <form id="rform" novalidate>
    <label for="short">Short URL</label>
    <input id="short" name="short" type="text" placeholder="https://example.com/AbC123xYz9" autocomplete="off" required>
    <button type="submit">Retrieve URL</button>
  </form>
  <p class="msg" id="rmsg" aria-live="polite"></p>
</div></main>

<footer><div class="wrap">© 2026 Rong Jin</div></footer>

<script>
const form=document.getElementById('form'),input=document.getElementById('url'),msg=document.getElementById('msg');
const say=(el,text,err)=>{el.className='msg'+(err?' err':'');el.textContent=text};
const show=(text,err)=>say(msg,text,err);
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const v=input.value.trim();
  let ok=false;
  try{const u=new URL(v);ok=u.protocol==='http:'||u.protocol==='https:'}catch(_){}
  if(!ok)return show('Enter a full URL starting with http:// or https://',true);
  show('Shortening…');
  try{
    const r=await fetch('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})});
    const d=await r.json();
    if(!r.ok)return show(d.error||'Something went wrong',true);
    msg.className='msg';
    msg.replaceChildren('Short link: ');
    const a=document.createElement('a');a.href=d.short_url;a.textContent=d.short_url;msg.append(a);
    const b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copy';
    b.onclick=async()=>{try{await navigator.clipboard.writeText(d.short_url);b.textContent='Copied'}catch(_){}};
    msg.append(' ',b);
  }catch(_){show('Could not reach the server. Start it with: python3 server.py',true)}
});
const rform=document.getElementById('rform'),rinput=document.getElementById('short'),rmsg=document.getElementById('rmsg');
rform.addEventListener('submit',async e=>{
  e.preventDefault();
  const v=rinput.value.trim();
  if(!v)return say(rmsg,'Enter a short link',true);
  say(rmsg,'Retrieving…');
  try{
    const r=await fetch('/api/expand',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({short_url:v})});
    const d=await r.json();
    if(!r.ok)return say(rmsg,d.error||'Something went wrong',true);
    rmsg.className='msg';
    rmsg.replaceChildren('Original URL: ');
    const a=document.createElement('a');a.href=d.url;a.textContent=d.url;a.rel='noopener noreferrer';a.target='_blank';rmsg.append(a);
  }catch(_){say(rmsg,'Could not reach the server. Start it with: python3 server.py',true)}
});
</script>
</body>
</html>
