[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urlshort"
version = "0.1.0"
description = "Turn a URL into a short, deterministic 10-character code."
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src"]
